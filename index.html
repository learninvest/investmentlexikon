<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Investmentlexikon">
<meta name="theme-color" content="#10b981">
<title>Investmentlexikon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f8fafc;--bg2:#ffffff;--bg3:#f1f5f9;
  --text:#0f172a;--text2:#475569;--border:#e2e8f0;
  --green:#10b981;--red:#ef4444;--orange:#f59e0b;
  --blue:#3b82f6;--purple:#8b5cf6;--pink:#ec4899;
  --nav-h:64px;--header-h:56px;
}
[data-dark]{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --text:#f1f5f9;--text2:#94a3b8;--border:#334155;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{padding-top:calc(var(--header-h) + env(safe-area-inset-top,0px));padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;min-height:var(--header-h);height:calc(var(--header-h) + env(safe-area-inset-top,0px));background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding:0 16px 10px;gap:12px;z-index:100}
.header-title{flex:1;font-size:17px;font-weight:600;color:var(--text)}
.icon-btn{width:36px;height:36px;border:none;background:var(--bg3);border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text)}

/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:100;transform:translateZ(0);will-change:transform}
.nav-btn{flex:1;border:none;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text2);font-size:10px;font-weight:500}
.nav-btn.active{color:var(--green)}
.nav-btn .nav-icon{font-size:22px;line-height:1}

/* PAGES */
.page{padding:16px 16px 24px;max-width:600px;margin:0 auto}
@media(max-width:430px){.page{padding:12px 12px 28px}}

/* TOUR */
.tour-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:300;pointer-events:none}
.tour-card{position:fixed;left:16px;right:16px;background:linear-gradient(135deg,#1e3a5f,#0f2d4a);border:1px solid #3b82f655;border-radius:20px;padding:20px;z-index:402;box-shadow:0 8px 40px rgba(0,0,0,.6);transition:top .25s ease}
.tour-card .tour-title{color:#f1f5f9}
.tour-card .tour-desc{color:#94a3b8}
.tour-highlight{position:relative;z-index:401;border-radius:18px;box-shadow:0 0 0 4px rgba(255,255,255,0.25),0 0 0 8px rgba(255,255,255,0.08);pointer-events:none}

/* INSTALL PROMPT */
.install-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:500;display:flex;align-items:flex-end;padding:16px}
.install-card{background:var(--bg2);border-radius:20px;padding:24px;width:100%;max-width:500px;margin:0 auto}

/* SEARCH */
.search-box{background:var(--bg3);border:none;border-radius:14px;padding:12px 16px;width:100%;font-size:16px;color:var(--text);outline:none}
.search-box::placeholder{color:var(--text2)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-card-full{grid-column:span 2}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .1s}
.cat-card:active{transform:scale(.97)}
.cat-icon{font-size:28px;margin-bottom:6px}
.cat-name{font-size:12px;font-weight:600;color:var(--text)}

/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-orange{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-purple{background:#ede9fe;color:#5b21b6}
[data-dark] .badge-green{background:#064e3b;color:#6ee7b7}
[data-dark] .badge-blue{background:#1e3a5f;color:#93c5fd}
[data-dark] .badge-orange{background:#451a03;color:#fcd34d}
[data-dark] .badge-red{background:#450a0a;color:#fca5a5}
[data-dark] .badge-purple{background:#2e1065;color:#c4b5fd}

/* INFO BOXES */
.box{border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6}
.box-blue{background:#eff6ff;border-left:3px solid var(--blue);color:#1e40af}
.box-green{background:#ecfdf5;border-left:3px solid var(--green);color:#065f46}
.box-orange{background:#fffbeb;border-left:3px solid var(--orange);color:#92400e}
.box-red{background:#fef2f2;border-left:3px solid var(--red);color:#991b1b}
[data-dark] .box-blue{background:#1e3a5f22;color:#93c5fd}
[data-dark] .box-green{background:#064e3b22;color:#6ee7b7}
[data-dark] .box-orange{background:#451a0322;color:#fcd34d}
[data-dark] .box-red{background:#450a0a22;color:#fca5a5}

/* TERM LIST */
.term-row{display:flex;align-items:center;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;gap:12px}
.term-row:active{background:var(--bg3)}
.term-icon-wrap{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.term-info{flex:1;min-width:0}
.term-name{font-size:15px;font-weight:600;color:var(--text)}
.term-short{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chevron{color:var(--text2);font-size:18px}

/* BUTTONS */
.btn{border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-blue{background:var(--blue);color:#fff}

/* STARS */
.stars{color:#f59e0b;font-size:14px;letter-spacing:2px}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text)}

/* QUIZ */
.quiz-option{background:var(--bg2);border:2px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;font-size:15px;transition:all .2s;text-align:left;width:100%}
.quiz-option.correct{border-color:var(--green);background:#ecfdf5}
.quiz-option.wrong{border-color:var(--red);background:#fef2f2}
[data-dark] .quiz-option.correct{background:#064e3b22}
[data-dark] .quiz-option.wrong{background:#450a0a22}
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}

/* CALC */
.tab-bar{display:flex;background:var(--bg3);border-radius:12px;padding:3px;margin-bottom:16px;gap:2px}
.tab{flex:1;border:none;background:none;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2)}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.input-group{margin-bottom:14px}
.input-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}
.input-field{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:16px;color:var(--text);outline:none}
.result-box{background:var(--bg3);border-radius:14px;padding:16px;margin-top:12px;text-align:center}
.result-num{font-size:32px;font-weight:700;color:var(--green)}
.result-label{font-size:13px;color:var(--text2);margin-top:4px}

/* SVG CHART */
.chart-wrap{margin-top:12px;overflow:hidden;border-radius:12px}

/* INVESTMENT TILES */
.inv-tile{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.inv-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.inv-icon{font-size:24px}
.inv-name{font-size:15px;font-weight:700;color:var(--text)}
.inv-recommended{font-size:11px;color:var(--green);font-weight:600}
.inv-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.inv-key{color:var(--text2)}
.inv-val{font-weight:600;color:var(--text)}

/* SECTION TITLE */
.section-title{font-size:18px;font-weight:700;color:var(--text);margin:16px 0 10px}
.section-sub{font-size:13px;color:var(--text2);margin-bottom:14px}

/* MODULE CARDS */
.module-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}
.module-card:active{background:var(--bg3)}
.module-icon{font-size:32px;margin-bottom:8px}
.module-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.module-desc{font-size:13px;color:var(--text2)}

/* DAY TERM */
.day-term{background:linear-gradient(135deg,#10b981,#3b82f6);border-radius:16px;padding:20px;color:#fff;margin-bottom:16px;cursor:pointer}
.day-term-label{font-size:12px;opacity:.8;margin-bottom:4px}
.day-term-name{font-size:22px;font-weight:700;margin-bottom:6px}
.day-term-short{font-size:14px;opacity:.9}

/* FOOTER */
.footer-note{text-align:center;font-size:11px;color:var(--text2);padding:16px;margin-top:8px}

/* SEARCH RESULTS */
.search-results{margin-top:12px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px}

/* SELECT */
select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:15px;color:var(--text);outline:none;appearance:none}

/* TABLE */
.compare-table{width:100%;border-collapse:collapse;font-size:13px}
.compare-table th{background:var(--bg3);padding:10px;text-align:left;font-weight:700;color:var(--text)}
.compare-table td{padding:10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
.compare-table tr:last-child td{border-bottom:none}

/* TRANSITIONS */
#app > *{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* INFO MODAL */
.info-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:600;display:flex;align-items:flex-end;padding:16px}
.info-modal{background:var(--bg2);border-radius:20px;padding:24px;width:100%;max-width:500px;margin:0 auto}
</style>
</head>
<body>

<div class="header" id="header">
  <button class="icon-btn" id="backBtn" style="display:none" data-action="back">←</button>
  <div class="header-title" id="headerTitle">📈 Börsen-Lexikon</div>
  <button class="icon-btn" id="darkBtn" data-action="toggleDark">🌙</button>
</div>

<div id="app"></div>

<nav class="nav">
  <button class="nav-btn active" data-action="nav" data-id="home"><span class="nav-icon">🏠</span>Home</button>
  <button class="nav-btn" data-action="nav" data-id="search"><span class="nav-icon">🔍</span>Suche</button>
  <button class="nav-btn" data-action="nav" data-id="favorites"><span class="nav-icon">⭐</span>Favoriten</button>
  <button class="nav-btn" data-action="nav" data-id="quiz"><span class="nav-icon">🧠</span>Quiz</button>
  <button class="nav-btn" data-action="nav" data-id="calc"><span class="nav-icon">🧮</span>Rechner</button>
</nav>

<script>
// ============================================================
// DATA
// ============================================================
const CATEGORIES = [
  {id:'etf-basics',name:'ETF Basics',icon:'🌍',color:'#10b981'},
  {id:'aktien-basics',name:'Aktien Basics',icon:'📈',color:'#3b82f6'},
  {id:'analysten',name:'Analysten & Ratings',icon:'🔍',color:'#8b5cf6'},
  {id:'marktphasen',name:'Marktphasen',icon:'📊',color:'#f59e0b'},
  {id:'kennzahlen',name:'Kennzahlen',icon:'📐',color:'#06b6d4'},
  {id:'steuern',name:'Steuern DE',icon:'🏛️',color:'#ef4444'},
  {id:'trading',name:'Trading & Risiko',icon:'⚠️',color:'#f97316'},
  {id:'psychologie',name:'Psychologie',icon:'🧠',color:'#ec4899'},
  {id:'broker-kosten',name:'Broker & Kosten',icon:'💸',color:'#64748b'},
  {id:'langfristig',name:'Langfristig',icon:'🌱',color:'#22c55e'},
  {id:'charts',name:'Charts verstehen',icon:'📊',color:'#6366f1'},
  {id:'trade-republic',name:'Trade Republic',icon:'📱',color:'#10b981'},
];

const TERMS = [
// ETF BASICS
{id:'etf',name:'ETF',category:'etf-basics',icon:'🌍',difficulty:1,
 shortExplanation:'Ein ETF (Exchange Traded Fund) ist ein Fonds, der einen Index wie den MSCI World automatisch nachbildet. Du kaufst quasi einen kleinen Anteil von hunderten Unternehmen auf einmal.',
 example:'Du kaufst einen MSCI World ETF für 100€ und bist damit sofort an über 1.600 Unternehmen aus 23 Ländern beteiligt.',
 whyImportant:'ETFs sind das wichtigste Werkzeug für Privatanleger: günstig, diversifiziert, transparent.',
 beginnerMistake:'Viele denken, ein ETF sei riskant wie eine Einzelaktie. In Wirklichkeit verteilt er das Risiko auf viele Unternehmen.',
 memSatz:'ETF = Korb voller Aktien, den du günstig kaufen kannst.',
 riskNote:null,
 relatedTerms:['msci-world','ter','sparplan','diversifikation'],
 quiz:{q:'Was ist ein ETF?',options:['Eine einzelne Aktie','Ein Fonds der einen Index nachbildet','Ein Sparkonto mit Zinsen','Eine Versicherung'],correct:1}},

{id:'msci-world',name:'MSCI World',category:'etf-basics',icon:'🌐',difficulty:1,
 shortExplanation:'Der MSCI World ist ein Index, der die 1.600 größten Unternehmen aus 23 Industrieländern enthält. Er gilt als Standard-Benchmark für globale Aktienanleger.',
 example:'Apple, Microsoft, LVMH, Toyota — all das steckt im MSCI World. Ein ETF darauf kostet oft nur 0,12% TER pro Jahr.',
 whyImportant:'Er ist der meistgenutzte Index für langfristige ETF-Sparpläne — historisch ca. 7-9% Rendite pro Jahr.',
 beginnerMistake:'70% USA-Anteil macht ihn nicht so "weltweit" wie der Name klingt. Wer breiter streuen will, nimmt den FTSE All-World.',
 memSatz:'MSCI World = die 1.600 wichtigsten Firmen der Welt in einem Index.',
 riskNote:'Hoher US-Anteil (~70%) ist ein Klumpenrisiko.',
 relatedTerms:['etf','ftse-all-world','sp500'],
 quiz:{q:'Wie viele Länder enthält der MSCI World?',options:['10','23','50','189'],correct:1}},

{id:'sp500',name:'S&P 500',category:'etf-basics',icon:'🇺🇸',difficulty:1,
 shortExplanation:'Der S&P 500 enthält die 500 größten US-Unternehmen. Er ist der wichtigste Aktienindex der Welt und Maßstab für die US-Wirtschaft.',
 example:'Apple, Amazon, Nvidia, Tesla — die 500 größten US-Konzerne. Ein ETF darauf kostet oft nur 0,07% TER.',
 whyImportant:'Historisch ca. 10% Rendite pro Jahr — einer der besten langfristigen Indizes.',
 beginnerMistake:'Nur USA — wer weltweit investieren will, sollte den MSCI World oder FTSE All-World wählen.',
 memSatz:'S&P 500 = die 500 mächtigsten US-Unternehmen.',
 riskNote:'100% USA-Risiko.',
 relatedTerms:['msci-world','etf','ftse-all-world'],
 quiz:{q:'Wie viele Unternehmen enthält der S&P 500?',options:['100','300','500','1000'],correct:2}},

{id:'ter',name:'TER (Kosten)',category:'etf-basics',icon:'💸',difficulty:2,
 shortExplanation:'Die Total Expense Ratio (TER) ist die jährliche Gesamtkostenquote eines ETFs — in Prozent vom investierten Kapital.',
 example:'ETF mit TER 0,2% kostet bei 10.000€ nur 20€ pro Jahr. Aktiver Fonds mit 1,5% TER kostet 150€.',
 whyImportant:'Kosten fressen Rendite. Über 30 Jahre macht der Unterschied von 0,2% vs 1,5% TER Zehntausende Euro aus.',
 beginnerMistake:'Viele ignorieren die TER und kaufen teure Fonds. Billiger ist langfristig fast immer besser.',
 memSatz:'TER = was der ETF dich jedes Jahr kostet. Je niedriger, desto besser.',
 riskNote:null,
 relatedTerms:['etf','tracking-difference','ausgabeaufschlag'],
 quiz:{q:'Was bedeutet eine niedrige TER?',options:['Höheres Risiko','Geringere Kosten','Bessere Performance','Mehr Dividenden'],correct:1}},

{id:'thesaurierend',name:'Thesaurierend',category:'etf-basics',icon:'🔄',difficulty:2,
 shortExplanation:'Thesaurierende ETFs reinvestieren Dividenden automatisch. Das Geld bleibt im Fonds und wächst durch den Zinseszins-Effekt.',
 example:'Dein ETF kassiert 2% Dividenden — statt sie dir auszuzahlen, kauft er automatisch mehr Anteile.',
 whyImportant:'Ideal für Langfristanleger: kein Aufwand, maximaler Zinseszins-Effekt.',
 beginnerMistake:'In Deutschland fällt jährlich die Vorabpauschale an — auch ohne Ausschüttung.',
 memSatz:'Thesaurierend = Dividenden werden automatisch reinvestiert.',
 riskNote:null,
 relatedTerms:['ausschuettend','vorabpauschale','sparplan'],
 quiz:{q:'Was passiert bei thesaurierenden ETFs mit Dividenden?',options:['Werden ausgezahlt','Werden reinvestiert','Werden einbehalten','Entfallen'],correct:1}},

{id:'ausschuettend',name:'Ausschüttend',category:'etf-basics',icon:'💰',difficulty:2,
 shortExplanation:'Ausschüttende ETFs zahlen Dividenden regelmäßig an dich aus — meist quartalsweise oder jährlich.',
 example:'Du hast 10.000€ im ETF, der 2% ausschüttet. Du bekommst 200€ aufs Konto — wie ein kleines passives Einkommen.',
 whyImportant:'Gut wenn du regelmäßige Einnahmen willst oder den Freibetrag (1.000€) optimal nutzen möchtest.',
 beginnerMistake:'Ausschüttungen müssen versteuert werden — thesaurierende ETFs sind steuereffizienter für Langfristanleger.',
 memSatz:'Ausschüttend = Dividenden kommen auf dein Konto.',
 riskNote:null,
 relatedTerms:['thesaurierend','abgeltungssteuer','sparerpauschbetrag'],
 quiz:{q:'Was macht ein ausschüttender ETF mit Dividenden?',options:['Reinvestiert sie','Zahlt sie aus','Löscht sie','Versteuert sie automatisch'],correct:1}},

{id:'diversifikation',name:'Diversifikation',category:'etf-basics',icon:'🎯',difficulty:1,
 shortExplanation:'Diversifikation bedeutet, das Risiko auf viele verschiedene Anlagen zu verteilen — "Nicht alle Eier in einen Korb."',
 example:'Statt alles in Tesla zu stecken, kaufst du einen ETF mit 1.600 Unternehmen. Geht Tesla pleite, verlierst du kaum was.',
 whyImportant:'Die einzige kostenlose Risikoreduzierung an der Börse.',
 beginnerMistake:'10 Tech-ETFs sind KEINE Diversifikation — alle bewegen sich gleich.',
 memSatz:'Diversifikation = Risiko verteilen = ruhiger schlafen.',
 riskNote:null,
 relatedTerms:['etf','msci-world','ftse-all-world'],
 quiz:{q:'Was ist Diversifikation?',options:['Alles in eine Aktie','Risiko auf viele Anlagen verteilen','Häufig kaufen und verkaufen','Den Markt timen'],correct:1}},

{id:'sparplan',name:'Sparplan',category:'etf-basics',icon:'📅',difficulty:1,
 shortExplanation:'Ein Sparplan investiert automatisch jeden Monat einen festen Betrag in ETFs — egal ob Markt hoch oder tief.',
 example:'25€/Monat in MSCI World ETF. Nach 30 Jahren bei 7% Rendite: ~30.000€ aus nur 9.000€ Einzahlungen.',
 whyImportant:'Spart Zeit, nutzt den Cost-Average-Effekt und macht Investieren zur Gewohnheit.',
 beginnerMistake:'Zu lange warten bis "der richtige Zeitpunkt" kommt. Den gibt es nicht.',
 memSatz:'Sparplan = Autopilot fürs Investieren.',
 riskNote:null,
 relatedTerms:['cost-average','etf','zinseszins'],
 quiz:{q:'Was ist der Vorteil eines ETF-Sparplans?',options:['Garantierte Gewinne','Automatisches regelmäßiges Investieren','Keine Steuern','Tägliche Auszahlungen'],correct:1}},

{id:'ftse-all-world',name:'FTSE All-World',category:'etf-basics',icon:'🌏',difficulty:2,
 shortExplanation:'Der FTSE All-World enthält ~4.000 Unternehmen aus Industrie- UND Schwellenländern weltweit — breiter als der MSCI World.',
 example:'Vanguard FTSE All-World ETF enthält Firmen aus über 49 Ländern — inklusive China, Indien, Brasilien.',
 whyImportant:'Noch breiter diversifiziert als MSCI World. Viele empfehlen ihn als "Ein-ETF-Lösung".',
 beginnerMistake:'Mehr Länder = nicht automatisch mehr Rendite, aber weniger Klumpenrisiko.',
 memSatz:'FTSE All-World = wirklich die ganze Welt in einem ETF.',
 riskNote:null,
 relatedTerms:['msci-world','etf','diversifikation'],

 beginnerMistake:'Cost-Averaging ist nicht immer besser als Einmalinvest — aber es beruhigt die Nerven.',

// LANGFRISTIG
{id:'zinseszins',name:'Zinseszins',category:'langfristig',icon:'🔢',difficulty:1,

// CHARTS
{id:'chart-lesen',name:'Chart lesen',category:'charts',icon:'📊',difficulty:1,

 beginnerMistake:'Charts in kurzfristigen Zeiträumen anschauen und Panik bekommen. Immer auch die Langfristansicht checken.',

{id:'candlestick',name:'Candlestick (Kerze)',category:'charts',icon:'🕯️',difficulty:2,

 riskNote:null,

{id:'support',name:'Support (Unterstützung)',category:'charts',icon:'🪨',difficulty:2,
 shortExplanation:'Support ist eine Preiszone, bei der ein Kurs immer wieder nach unten abprallt — viele Käufer springen dort ein.',
 example:'Apple fällt jedes Mal auf 170€ und erholt sich dann. 170€ ist die Support-Zone.',
 whyImportant:'Support-Zonen helfen zu verstehen, wo ein Kurs Halt finden könnte.',
 beginnerMistake:'Support-Zonen sind keine Garantie. Sie können gebrochen werden — dann wird aus Support oft Widerstand.',
 memSatz:'Support = Kurs prellt nach oben ab. Boden für den Preis.',
 riskNote:null,
 relatedTerms:['widerstand','trendlinie','candlestick'],
 quiz:{q:'Was ist ein Support-Level?',options:['Höchstkurs','Preiszone wo Kurs nach oben abprallt','Dividendenzahlung','Eröffnungskurs'],correct:1}},

{id:'widerstand',name:'Widerstand (Resistance)',category:'charts',icon:'🛑',difficulty:2,
 shortExplanation:'Widerstand ist eine Preiszone, bei der ein Kurs immer wieder nach oben abprallt — viele Verkäufer werden dort aktiv.',

 whyImportant:'Widerstandszonen zeigen, wo viele Anleger verkaufen wollen.',
 beginnerMistake:'Ein Ausbruch über den Widerstand ist bullisch — danach wird Widerstand oft zum neuen Support.',
 memSatz:'Widerstand = Kurs prellt nach unten ab. Decke für den Preis.',
 riskNote:null,
 relatedTerms:['support','ausbruch','trendlinie'],
 quiz:{q:'Was passiert typischerweise an einer Widerstandszone?',options:['Kurs steigt durch','Kurs prellt nach unten ab','Dividende wird gezahlt','Volumen sinkt'],correct:1}},

{id:'trendlinie',name:'Trendlinie',category:'charts',icon:'📐',difficulty:2,

 riskNote:null,
 relatedTerms:['support','widerstand','ausbruch'],
 quiz:{q:'Was verbindet eine Aufwärtstrendlinie?',options:['Höchstkurse','Aufeinanderfolgende Tiefs','Dividendenzahlungen','Volumenmaxima'],correct:1}},

{id:'volumen-chart',name:'Volumen im Chart',category:'charts',icon:'📶',difficulty:2,

 quiz:{q:'Was bedeutet ein Kursanstieg mit sehr hohem Volumen?',options:['Kurs fällt bald','Starkes, glaubwürdiges Signal','Dividende steht an','Kurs ist zu teuer'],correct:1}},

{id:'ausbruch',name:'Ausbruch (Breakout)',category:'charts',icon:'🚀',difficulty:2,
 shortExplanation:'Ein Ausbruch passiert wenn der Kurs eine Widerstands- oder Supportzone mit Schwung durchbricht.',

{id:'gap',name:'Gap (Kurslücke)',category:'charts',icon:'🕳️',difficulty:2,

// ============================================================
// HELPERS
// ============================================================
function getTermById(id) { return TERMS.find(t => t.id === id); }
function getCatById(id) { return CATEGORIES.find(c => c.id === id); }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }
function fmt(n) { return n.toLocaleString('de-DE', {maximumFractionDigits:0}) + ' €'; }
function fmtN(n,d=2) { return n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); }

function termsByCategory(catId) { return TERMS.filter(t => t.category === catId); }
function termSearch(q) {
  const lq = q.toLowerCase();
  return TERMS.filter(t =>
    t.name.toLowerCase().includes(lq) ||
    t.shortExplanation.toLowerCase().includes(lq) ||
    t.id.includes(lq)
  );
}

function render() {
  const app = document.getElementById('app');
  const backBtn = document.getElementById('backBtn');
  const headerTitle = document.getElementById('headerTitle');
  const darkBtn = document.getElementById('darkBtn');

  // Dark mode
  document.body.toggleAttribute('data-dark', state.dark);
  darkBtn.textContent = state.dark ? '☀️' : '🌙';

  // Nav
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === state.page);
  });

  // Back button
  const showBack = ['term','category','module','learn-pick','learn','learn-done','disclaimer','account'].includes(state.page);
  backBtn.style.display = showBack ? 'flex' : 'none';

  // Header title
  const titles = {
    home: userName ? `📈 Investmentlexikon für ${userName}` : '📈 Investmentlexikon', search:'🔍 Suche', favorites:'⭐ Favoriten',
    quiz:'🧠 Quiz', calc:'🧮 Rechner', term:'', category:'', module:'',
  };
  if (state.page === 'term' && state.termId) {
    const t = getTermById(state.termId);
    headerTitle.textContent = t ? t.icon + ' ' + t.name : '←';
  } else if (state.page === 'category' && state.categoryId) {
    const c = getCatById(state.categoryId);
    headerTitle.textContent = c ? c.icon + ' ' + c.name : '←';
  } else if (state.page === 'module') {
    headerTitle.textContent = '📚 Modul';
  } else {
    headerTitle.textContent = titles[state.page] || (userName ? `📈 Investmentlexikon für ${userName}` : '📈 Investmentlexikon');
    if (state.page === 'home' && userName) {
      headerTitle.style.cursor = 'pointer';
      headerTitle.dataset.action = 'editName';
    } else {
      headerTitle.style.cursor = '';
      delete headerTitle.dataset.action;
    }
  }

  // Page content
  let html = '';
  switch(state.page) {
    case 'home': html = renderHome(); break;
    case 'search': html = renderSearch(); break;
    case 'favorites': html = renderFavorites(); break;
    case 'quiz': html = renderQuiz(); break;
    case 'calc': html = renderCalc(); break;
    case 'term': html = renderTerm(); break;
    case 'category': html = renderCategory(); break;
    case 'module': html = renderModule(); break;
    case 'learn-pick': html = renderLearnPick(); break;
    case 'learn': html = renderLearn(); break;
    case 'learn-done': html = renderLearnDone(); break;
    case 'onboarding': html = renderOnboarding(); break;
    case 'disclaimer': html = renderDisclaimer(); break;
    case 'account': html = renderAccount(); break;
    default: html = renderHome();
  }
  // Remove old overlays
  document.querySelectorAll('#tourOverlay,.tour-overlay,.tour-card,#installOverlay,.install-overlay').forEach(e => e.remove());

  app.innerHTML = html;

  // Tour overlay (injected after app so it sits above)
  if (state.tourActive && state.page === 'home') {
    document.body.insertAdjacentHTML('beforeend', renderTourOverlay());
  }

  // Install prompt disabled — handled by onboarding

  bindEvents();
}

    ${related ? `<div style="margin-bottom:12px"><strong style="font-size:13px">Verwandte Begriffe:</strong><div class="chips">${related}</div></div>` : ''}

    <!-- Action buttons -->
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn ${isUnd?'btn-green':'btn-outline'}" style="flex:1;padding:12px" data-action="toggleUnderstood" data-id="${t.id}">
        ${isUnd?'✓ Verstanden':'○ Verstanden'}
      </button>
      <button class="btn btn-outline" style="flex:0 0 auto;padding:12px 16px" data-action="toggleFav" data-id="${t.id}">
        ${isFav?'⭐':'☆'}
      </button>
    </div>

    <!-- Navigation -->
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" style="flex:1;padding:12px" data-action="catPrev" ${idx===0?'disabled style="opacity:.4"':''}>← Zurück</button>
      <button class="btn ${isUnd?'btn-outline':'btn-green'}" style="flex:1;padding:12px" data-action="catNext" ${idx===total-1?'disabled style="opacity:.4"':''}>

      </button>
    </div>
  </div>`;
}

function getQuizTerms() {
  const shuffled = [...TERMS].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 10);
}

function renderQuiz() {
  if (state.quizDone) return renderQuizResult();
  if (state.quizQuestions.length === 0) return renderQuizStart();

  const q = state.quizQuestions[state.quizQ];
  const progress = (state.quizQ / state.quizQuestions.length) * 100;

  return `<div class="page">
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>

      <div style="font-size:32px;text-align:center;margin-bottom:12px">${q.icon}</div>
      <div style="font-size:18px;font-weight:700;text-align:center;color:var(--text)">${q.quiz.q}</div>
    </div>
    ${q.quiz.options.map((opt, i) => {
      let cls = 'quiz-option';
      if (state.quizAnswered) {
        if (i === q.quiz.correct) cls += ' correct';
        else if (i === state.quizSelected) cls += ' wrong';

      return `<button class="${cls}" ${state.quizAnswered ? 'disabled' : ''} data-action="quizAnswer" data-id="${i}">${opt}</button>`;

      <div class="box ${state.quizSelected === q.quiz.correct ? 'box-green' : 'box-orange'}" style="margin-top:8px">
        ${state.quizSelected === q.quiz.correct ? '✅ Richtig!' : `❌ Leider falsch. Richtig: "${q.quiz.options[q.quiz.correct]}"`}
      </div>
      <button class="btn btn-green" data-action="quizNext" style="margin-top:8px">

function renderCalc() {
  const tabs = ['Zinseszins','TER-Kosten','Steuer (ETF)','Immobilien'];
  const tabBar = `<div class="tab-bar">${tabs.map((t,i) =>
    `<button class="tab ${state.calcTab===i?'active':''}" data-action="calcTab" data-id="${i}">${t}</button>`
  ).join('')}</div>`;

  let content = '';
  if (state.calcTab === 0) content = renderCalcZinseszins();
  else if (state.calcTab === 1) content = renderCalcTER();
  else if (state.calcTab === 2) content = renderCalcSteuer();
  else content = renderCalcImmobilien();

  return `<div class="page">${tabBar}${content}</div>`;
}

function renderCalcZinseszins() {
  const start = parseFloat(document.getElementById('cz_start')?.value || 1000);
  const monthly = parseFloat(document.getElementById('cz_monthly')?.value || 100);
  const years = parseInt(document.getElementById('cz_years')?.value || 20);
  const rate = parseFloat(document.getElementById('cz_rate')?.value || 7) / 100;

  // Build yearly data
  let val = start;
  const data = [{year:0, total:val, invested:start}];
  let turningPoint = null;
  for (let y = 1; y <= years; y++) {
    const prev = val;
    for (let m = 0; m < 12; m++) val = val * (1 + rate/12) + monthly;
    const yearInterest = val - prev - monthly*12;
    if (!turningPoint && yearInterest >= monthly*12) turningPoint = y;
    data.push({year:y, total:val, invested: start + monthly*12*y});
  }
  const invested = start + monthly*12*years;
  const gain = val - invested;

  // Find first million
  let millionYear = null;
  for (let i = 0; i < data.length; i++) { if (data[i].total >= 1000000) { millionYear = data[i].year; break; } }
  if (!millionYear) {
    let tv = val;
    for (let y = years+1; y <= 200; y++) {
      for (let m = 0; m < 12; m++) tv = tv*(1+rate/12)+monthly;
      if (tv >= 1000000) { millionYear = y; break; }
    }
  }

  // SVG
  const W=340, H=160, pL=40, pR=12, pT=16, pB=24;
  const cW = W-pL-pR, cH = H-pT-pB;
  const maxV = Math.max(...data.map(d=>d.total));
  const xOf = y => pL + (y/years)*cW;
  const yOf = v => pT + cH - (v/maxV)*cH;

  const totalPts = data.map(d=>`${xOf(d.year)},${yOf(d.total)}`).join(' ');
  const invPts   = data.map(d=>`${xOf(d.year)},${yOf(d.invested)}`).join(' ');
  const areaFill = `M${xOf(0)},${yOf(0)} ${data.map(d=>`L${xOf(d.year)},${yOf(d.total)}`).join(' ')} L${xOf(years)},${pT+cH} L${xOf(0)},${pT+cH} Z`;
  const invFill  = `M${xOf(0)},${yOf(data[0].invested)} ${data.map(d=>`L${xOf(d.year)},${yOf(d.invested)}`).join(' ')} L${xOf(years)},${pT+cH} L${xOf(0)},${pT+cH} Z`;

  // Y-axis labels
  const yLabels = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const v = maxV*f;
    const label = v>=1000000 ? (v/1000000).toFixed(1)+'M' : v>=1000 ? Math.round(v/1000)+'k' : Math.round(v)+'';
    return `<text x="${pL-4}" y="${yOf(v)+4}" font-size="9" fill="#64748b" text-anchor="end">${label}</text>
            <line x1="${pL}" y1="${yOf(v)}" x2="${W-pR}" y2="${yOf(v)}" stroke="#334155" stroke-width="0.5" opacity="0.4"/>`;
  }).join('');

  // X-axis milestone labels
  const xMilestones = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50].filter(y=>y<=years && (years<=20 ? y%5===0 : y%10===0));
  const xLabels = xMilestones.map(y =>
    `<text x="${xOf(y)}" y="${H-4}" font-size="9" fill="#64748b" text-anchor="middle">Jahr ${y===0?'0':y}</text>`
  ).join('');

  // Turning point marker
  const tpSvg = turningPoint && turningPoint <= years ? `
    <line x1="${xOf(turningPoint)}" y1="${pT}" x2="${xOf(turningPoint)}" y2="${pT+cH}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="${xOf(turningPoint)}" cy="${yOf(data[turningPoint].total)}" r="5" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>` : '';

  const chartData = encodeURIComponent(JSON.stringify(data));

  return `
    <div class="input-group"><label class="input-label">Startkapital (€)</label>
      <input class="input-field" id="cz_start" type="number" value="${start}" data-action="calcUpdate"></div>
    <div class="input-group"><label class="input-label">Monatliche Rate (€)</label>
      <input class="input-field" id="cz_monthly" type="number" value="${monthly}" data-action="calcUpdate"></div>
    <div class="input-group"><label class="input-label">Laufzeit (Jahre)</label>
      <input class="input-field" id="cz_years" type="number" value="${years}" min="1" max="80" data-action="calcUpdate"></div>
    <div class="input-group"><label class="input-label">Rendite pro Jahr (%)</label>
      <input class="input-field" id="cz_rate" type="number" value="${rate*100}" step="0.1" data-action="calcUpdate"></div>

    <div class="result-box">
      <div class="result-num">${fmt(val)}</div>
      <div class="result-label">Endkapital nach ${years} Jahren</div>
      <div style="display:flex;justify-content:space-around;margin-top:12px;font-size:13px">
        <div><div style="font-weight:700;color:var(--text)">${fmt(invested)}</div><div style="color:var(--text2)">Eingezahlt</div></div>
        <div><div style="font-weight:700;color:var(--green)">${fmt(gain)}</div><div style="color:var(--text2)">Zinseszins</div></div>
      </div>
    </div>

    <!-- Milestones -->
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">
      ${[5,10,20].filter(y=>y<=years).map(y=>`
        <div style="background:var(--bg3);border-radius:10px;padding:6px 10px;font-size:12px">
          <span style="color:var(--text2)">Jahr ${y}:</span>
          <strong style="color:var(--text)">${fmt(data[y]?.total||0)}</strong>
        </div>`).join('')}
      ${turningPoint ? `<div style="background:#451a0322;border:1px solid #f59e0b44;border-radius:10px;padding:6px 10px;font-size:12px;flex-basis:100%;display:flex;align-items:center;gap:6px;cursor:pointer" data-action="showTurningInfo">
        <span style="color:#f59e0b">⚡ Ab Jahr ${turningPoint}:</span>
        <strong style="color:var(--text)">Rendite > Einzahlung</strong>
        <span style="margin-left:auto;font-size:16px;animation:pulse 2s infinite">ℹ️</span>
      </div>` : ''}
      ${millionYear ? `<div style="background:#064e3b22;border:1px solid var(--green);border-radius:10px;padding:6px 10px;font-size:12px">
        <span style="color:var(--green)">🏆 Erste Million:</span>
        <strong style="color:var(--text)">Jahr ${millionYear}</strong>
      </div>` : '<div style="background:var(--bg3);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--text2)">🏆 Million: Laufzeit erhöhen</div>'}
    </div>

    <!-- Legende -->
    <div style="display:flex;gap:14px;font-size:11px;margin-bottom:6px;padding-left:4px">
      <div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:3px;background:#10b981;border-radius:2px"></div><span style="color:var(--text2)">Gesamtwert</span></div>
      <div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:3px;background:#3b82f6;border-radius:2px"></div><span style="color:var(--text2)">Eingezahlt</span></div>
      ${turningPoint ? `<div style="display:flex;align-items:center;gap:4px"><div style="width:3px;height:12px;background:#f59e0b;border-radius:2px"></div><span style="color:var(--text2)">Turning Point</span></div>` : ''}
    </div>

    <!-- Interactive Chart -->
    <div style="position:relative;background:var(--bg3);border-radius:12px;overflow:hidden">
      <svg id="czChart" viewBox="0 0 ${W} ${H}" style="width:100%;display:block;touch-action:none" data-chart="${chartData}" data-years="${years}" data-maxv="${maxV}" data-pl="${pL}" data-pr="${pR}" data-pt="${pT}" data-pb="${pB}" data-cw="${cW}" data-ch="${cH}">
        <defs>
          <linearGradient id="gTotal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/><stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/></linearGradient>
          <linearGradient id="gInv" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/></linearGradient>
        </defs>
        ${yLabels}
        ${xLabels}
        <path d="${invFill}" fill="url(#gInv)"/>
        <path d="${areaFill}" fill="url(#gTotal)"/>
        <polyline points="${invPts}" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="${totalPts}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${tpSvg}
        <!-- Indicator (hidden initially) -->
        <line id="czLine" x1="0" y1="${pT}" x2="0" y2="${pT+cH}" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" display="none"/>
        <circle id="czDot" cx="0" cy="0" r="5" fill="#10b981" stroke="#fff" stroke-width="2" display="none"/>
        <rect id="czHitArea" x="${pL}" y="${pT}" width="${cW}" height="${cH}" fill="transparent" style="cursor:crosshair"/>
      </svg>
      <!-- Tooltip -->
      <div id="czTooltip" style="display:none;position:absolute;top:${pT+4}px;background:rgba(15,23,42,0.92);color:#f1f5f9;border-radius:10px;padding:8px 12px;font-size:12px;pointer-events:none;white-space:nowrap;border:1px solid #334155;z-index:10"></div>
    </div>`;
}

function renderCalcTER() {
  const start = 10000;
  const monthly = 100;
  const years = 30;
  const rate = 0.07;
  const ter1 = 0.001, ter2 = 0.008;

  function calc(ter) {
    let v = start;
    for (let y = 0; y < years; y++) {
      for (let m = 0; m < 12; m++) v = v * (1 + (rate-ter)/12) + monthly;
    }
    return v;
  }

  const v1 = calc(ter1), v2 = calc(ter2);
  const diff = v1 - v2;

  return `
    <div class="box box-blue"><strong>Was ist die TER?</strong><br>TER = Total Expense Ratio — die jährliche Gesamtkostenquote eines ETFs. Sie zeigt, wie viel Prozent deines investierten Kapitals der Fonds pro Jahr als Verwaltungskosten einbehält — automatisch, ohne dass du es merkst. Ein ETF mit 0,2% TER kostet bei 10.000 € genau 20 € pro Jahr. Je niedriger, desto besser.</div>
    <div class="box box-green" style="margin-top:-4px">Simulation: 10.000€ Start + 100€/Monat, 7% Rendite, 30 Jahre</div>
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div><strong>Günstiger ETF</strong><div style="font-size:13px;color:var(--text2)">TER 0,10%/Jahr</div></div>
        <div style="font-size:20px;font-weight:700;color:var(--green)">${fmt(v1)}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div><strong>Teurer Fonds</strong><div style="font-size:13px;color:var(--text2)">TER 0,80%/Jahr</div></div>
        <div style="font-size:20px;font-weight:700;color:var(--red)">${fmt(v2)}</div>
      </div>
    </div>
    <div class="result-box">
      <div class="result-num">${fmt(diff)}</div>
      <div class="result-label">Mehr mit günstigem ETF nach 30 Jahren</div>
    </div>
    ${barChart([v2,v1],['Teurer Fonds\n0,80%','Günstiger ETF\n0,10%'])}`;
}

function renderCalcSteuer() {
  const buy = parseFloat(document.getElementById('cs_buy')?.value || 10000);
  const sell = parseFloat(document.getElementById('cs_sell')?.value || 15000);
  const used = parseFloat(document.getElementById('cs_used')?.value || 0);
  const isETF = document.getElementById('cs_etf')?.checked ?? true;

  const rawGain = sell - buy;
  const freibetrag = Math.max(0, 1000 - used);
  const taxable = Math.max(0, rawGain - freibetrag);
  const teilfrei = isETF ? taxable * 0.7 : taxable;
  const abgelt = teilfrei * 0.25;
  const soli = abgelt * 0.055;
  const steuer = abgelt + soli;
  const netto = rawGain - steuer;

  return `
    <div class="input-group"><label class="input-label">Kaufpreis (€)</label>
      <input class="input-field" id="cs_buy" type="number" value="10000" data-action="calcUpdate"></div>
    <div class="input-group"><label class="input-label">Verkaufspreis (€)</label>
      <input class="input-field" id="cs_sell" type="number" value="15000" data-action="calcUpdate"></div>
    <div class="input-group"><label class="input-label">Bereits genutzter Freibetrag (€)</label>
      <input class="input-field" id="cs_used" type="number" value="0" min="0" max="1000" data-action="calcUpdate"></div>
    <div class="input-group" style="display:flex;align-items:center;gap:10px">
      <input type="checkbox" id="cs_etf" ${document.getElementById('cs_etf')?.checked !== false ? 'checked' : ''} data-action="calcUpdate" style="width:20px;height:20px">
      <label class="input-label" style="margin:0" for="cs_etf">Aktien-ETF (30% Teilfreistellung)</label>
    </div>
    <div class="result-box">
      <div style="display:grid;gap:8px;text-align:left;font-size:14px">
        <div style="display:flex;justify-content:space-between"><span>Brutto-Gewinn</span><strong>${fmt(rawGain)}</strong></div>
        <div style="display:flex;justify-content:space-between"><span>Freibetrag</span><strong style="color:var(--green)">- ${fmt(Math.min(freibetrag,rawGain))}</strong></div>
        ${isETF ? `<div style="display:flex;justify-content:space-between"><span>Teilfreistellung (30%)</span><strong style="color:var(--green)">- ${fmt(Math.max(0,taxable*0.3))}</strong></div>` : ''}
        <div style="display:flex;justify-content:space-between"><span>Abgeltungssteuer 25%</span><strong style="color:var(--red)">- ${fmt(abgelt)}</strong></div>
        <div style="display:flex;justify-content:space-between"><span>Soli 5,5%</span><strong style="color:var(--red)">- ${fmt(soli)}</strong></div>
        <div style="border-top:1px solid var(--border);padding-top:8px;display:flex;justify-content:space-between"><span><strong>Netto-Gewinn</strong></span><strong style="color:var(--green);font-size:18px">${fmt(netto)}</strong></div>
      </div>
    </div>`;
}

function renderCalcFehler() {
  const fehler = [
    {id:'panic',label:'Panikverkauf im Crash',desc:'Du verkaufst im Crash und verpasst die Erholung.',cost:y=>Math.pow(1.07,y)*10000-10000,miss:y=>Math.pow(1.35,y)*10000-10000},
    {id:'late',label:'10 Jahre zu spät gestartet',desc:'Statt mit 25 erst mit 35 angefangen.',cost:y=>0,miss:y=>(Math.pow(1.07,y+10)-Math.pow(1.07,y))*10000},
    {id:'expensive',label:'Teurer Fonds (1,5% TER)',desc:'Teurer statt günstiger ETF über 30 Jahre.',cost:y=>0,miss:y=>(Math.pow(1.07,y)-Math.pow(1.055,y))*10000},
    {id:'tagesgeld',label:'Tagesgeld statt ETF',desc:'Alle 30 Jahre auf Tagesgeld (3%) statt ETF (7%).',cost:y=>0,miss:y=>(Math.pow(1.07,y)-Math.pow(1.03,y))*10000},
  ];

  const sel = document.getElementById('cf_sel')?.value || 'panic';
  const f = fehler.find(x => x.id === sel) || fehler[0];
  const years = 20;
  const miss = f.miss(years);

  return `
    <div class="input-group"><label class="input-label">Welcher Fehler?</label>
      <select id="cf_sel" data-action="calcUpdate">
        ${fehler.map(f => `<option value="${f.id}">${f.label}</option>`).join('')}
      </select>
    </div>
    <div class="box box-orange">${f.desc}</div>
    <div class="result-box">
      <div class="result-num" style="color:var(--red)">- ${fmt(miss)}</div>
      <div class="result-label">Entgangene Rendite über 20 Jahre (10.000€ Basis)</div>
    </div>
    <div class="box box-green">💡 Der Fehler kostet dich so viel. Fang jetzt an, mach es richtig.</div>`;
}

function renderCalcImmobilien() {
  const BUNDESLAENDER = [
    {name:'Bayern',rate:3.5},{name:'Sachsen',rate:3.5},{name:'Hamburg',rate:4.5},
    {name:'Baden-Württemberg',rate:5.0},{name:'Bremen',rate:5.0},{name:'Niedersachsen',rate:5.0},
    {name:'Rheinland-Pfalz',rate:5.0},{name:'Sachsen-Anhalt',rate:5.0},
    {name:'Berlin',rate:6.0},{name:'Hessen',rate:6.0},{name:'Mecklenburg-Vorpommern',rate:6.0},
    {name:'Brandenburg',rate:6.5},{name:'Nordrhein-Westfalen',rate:6.5},
    {name:'Saarland',rate:6.5},{name:'Schleswig-Holstein',rate:6.5},{name:'Thüringen',rate:6.5},
  ];

  const kaufpreis   = parseFloat(document.getElementById('immo_kp')?.value   || 400000);
  const maklerJa    = document.getElementById('immo_makler')?.checked ?? true;
  const maklerPct   = parseFloat(document.getElementById('immo_maklerpct')?.value || 3.57) / 100;
  const blIdx       = parseInt(document.getElementById('immo_bl')?.value ?? 5);
  const bl          = BUNDESLAENDER[blIdx];
  const eigenkapital= parseFloat(document.getElementById('immo_ek')?.value    || 80000);
  const zinssatz    = parseFloat(document.getElementById('immo_zins')?.value   || 3.5)  / 100;
  const modeRate    = state.immoModeRate;
  const laufzeit    = parseInt(document.getElementById('immo_laufzeit')?.value   || 25);
  const wunschRate  = parseFloat(document.getElementById('immo_wunschrate')?.value || 1500);

  // Nebenkosten
  const maklerKosten  = maklerJa ? kaufpreis * maklerPct : 0;
  const grunderwerbst = kaufpreis * bl.rate / 100;
  const notarKosten   = kaufpreis * 0.02;
  const nebenkosten   = maklerKosten + grunderwerbst + notarKosten;
  const gesamtKauf    = kaufpreis + nebenkosten;
  const darlehen      = Math.max(0, gesamtKauf - eigenkapital);
  const ekQuote       = (eigenkapital / gesamtKauf * 100);

  // Darlehensberechnung
  const r = zinssatz / 12; // monatlicher Zinssatz
  let monatsrate = 0, laufzeitBerechnet = 0, gesamtZinsen = 0;

  if (modeRate) {
    // Laufzeit → Monatsrate
    const n = laufzeit * 12;
    monatsrate = r === 0 ? darlehen / n : darlehen * (r * Math.pow(1+r,n)) / (Math.pow(1+r,n) - 1);
    gesamtZinsen = monatsrate * n - darlehen;
    laufzeitBerechnet = laufzeit;
  } else {
    // Wunschrate → Laufzeit
    monatsrate = wunschRate;
    if (r === 0) {
      laufzeitBerechnet = darlehen / monatsrate / 12;
    } else {
      const n = -Math.log(1 - darlehen * r / monatsrate) / Math.log(1 + r);
      laufzeitBerechnet = n / 12;
    }
    gesamtZinsen = monatsrate * laufzeitBerechnet * 12 - darlehen;
  }

  const gesamtKosten = kaufpreis + nebenkosten + Math.max(0, gesamtZinsen);

  return `
    <div class="section-title" style="margin-top:0">🏠 Kaufpreis & Nebenkosten</div>

    <div class="input-group"><label class="input-label">Kaufpreis (€)</label>
      <input class="input-field" id="immo_kp" type="number" value="${kaufpreis}" data-action="calcUpdate"></div>

    <div class="input-group" style="display:flex;align-items:center;gap:10px">
      <input type="checkbox" id="immo_makler" ${maklerJa?'checked':''} data-action="calcUpdate" style="width:20px;height:20px;flex-shrink:0">
      <label class="input-label" style="margin:0;flex:1" for="immo_makler">Maklerprovision</label>
      ${maklerJa ? `<input class="input-field" id="immo_maklerpct" type="number" value="${(maklerPct*100).toFixed(2)}" step="0.01" data-action="calcUpdate" style="width:90px">` : `<span style="color:var(--text2);font-size:13px">0%</span>`}
    </div>

    <div class="input-group"><label class="input-label">Grunderwerbsteuer — Bundesland</label>
      <select id="immo_bl" data-action="calcUpdate">
        ${BUNDESLAENDER.map((b,i)=>`<option value="${i}" ${i===blIdx?'selected':''}>${b.name} (${b.rate}%)</option>`).join('')}
      </select>
    </div>

    <div class="card-sm" style="margin-bottom:14px">
      <div class="inv-row"><span class="inv-key">Kaufpreis</span><span class="inv-val">${fmt(kaufpreis)}</span></div>
      ${maklerJa?`<div class="inv-row"><span class="inv-key">Makler (${(maklerPct*100).toFixed(2)}%)</span><span class="inv-val">${fmt(maklerKosten)}</span></div>`:''}
      <div class="inv-row"><span class="inv-key">Grunderwerbsteuer (${bl.rate}%)</span><span class="inv-val">${fmt(grunderwerbst)}</span></div>
      <div class="inv-row"><span class="inv-key">Notar & Grundbuch (2%)</span><span class="inv-val">${fmt(notarKosten)}</span></div>
      <div class="inv-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px"><span class="inv-key"><strong>Gesamtkosten</strong></span><span class="inv-val" style="color:var(--blue)"><strong>${fmt(gesamtKauf)}</strong></span></div>
    </div>

    <div class="section-title">💰 Eigenkapital & Darlehen</div>
    <div class="input-group"><label class="input-label">Eigenkapital (€)</label>
      <input class="input-field" id="immo_ek" type="number" value="${eigenkapital}" data-action="calcUpdate"></div>

    <div class="card-sm" style="margin-bottom:14px">
      <div class="inv-row"><span class="inv-key">Eigenkapital</span><span class="inv-val" style="color:var(--green)">${fmt(eigenkapital)}</span></div>
      <div class="inv-row"><span class="inv-key">Eigenkapital-Quote</span><span class="inv-val" style="${ekQuote<20?'color:var(--red)':ekQuote>=30?'color:var(--green)':'color:var(--orange)'}">${ekQuote.toFixed(1)}%</span></div>
      <div class="inv-row"><span class="inv-key"><strong>Benötigtes Darlehen</strong></span><span class="inv-val" style="color:var(--red)"><strong>${fmt(darlehen)}</strong></span></div>
    </div>
    ${ekQuote < 20 ? `<div class="box box-orange" style="margin-bottom:14px">⚠️ Weniger als 20% Eigenkapital — Banken verlangen dann oft höhere Zinsen oder lehnen ab.</div>` : ''}

    <div class="section-title">📅 Finanzierung</div>
    <div class="input-group"><label class="input-label">Zinssatz p.a. (%)</label>
      <input class="input-field" id="immo_zins" type="number" value="${(zinssatz*100).toFixed(2)}" step="0.1" data-action="calcUpdate"></div>

    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="${modeRate?'btn btn-green':'btn btn-outline'}" style="flex:1;padding:10px;font-size:13px" data-action="immoModeRate">Laufzeit → Rate</button>
      <button class="${!modeRate?'btn btn-green':'btn btn-outline'}" style="flex:1;padding:10px;font-size:13px" data-action="immoModeMonth">Rate → Laufzeit</button>
    </div>

    ${modeRate ? `
      <div class="input-group"><label class="input-label">Laufzeit (Jahre)</label>
        <input class="input-field" id="immo_laufzeit" type="number" value="${laufzeit}" min="5" max="40" data-action="calcUpdate"></div>
    ` : `
      <div class="input-group"><label class="input-label">Maximale Monatsrate (€)</label>
        <input class="input-field" id="immo_wunschrate" type="number" value="${wunschRate}" data-action="calcUpdate"></div>
    `}

    <div class="result-box">
      <div style="display:grid;gap:10px">
        <div style="text-align:center">
          <div style="font-size:28px;font-weight:700;color:var(--green)">${fmt(monatsrate)}/Monat</div>
          <div style="font-size:12px;color:var(--text2)">Monatsrate über ${modeRate ? laufzeit : laufzeitBerechnet.toFixed(1)} Jahre</div>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:12px;display:grid;gap:6px;font-size:13px">
          <div class="inv-row"><span class="inv-key">Kaufpreis</span><span class="inv-val">${fmt(kaufpreis)}</span></div>
          <div class="inv-row"><span class="inv-key">Nebenkosten</span><span class="inv-val">${fmt(nebenkosten)}</span></div>
          <div class="inv-row"><span class="inv-key">Zinsen gesamt (an die Bank)</span><span class="inv-val" style="color:var(--red)">${fmt(Math.max(0,gesamtZinsen))}</span></div>
          <div class="inv-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px"><span><strong>Gesamtbelastung</strong></span><span style="font-weight:700;font-size:16px;color:var(--blue)">${fmt(gesamtKosten)}</span></div>
        </div>
      </div>
    </div>
    <div class="box box-orange" style="margin-top:12px">⚠️ Nur zur Orientierung. Konditionen variieren je nach Bank und Bonität. Immer unabhängige Beratung einholen.</div>`;
}

function lineChart(data, years) {
  const W = 340, H = 120, pad = 10;
  const max = Math.max(...data);
  const pts = data.map((v,i) => {
    const x = pad + (i / (data.length - 1)) * (W - 2*pad);
    const y = H - pad - ((v / max) * (H - 2*pad));
    return `${x},${y}`;
  }).join(' ');

  return `<div class="chart-wrap" style="background:var(--bg3);padding:12px">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
      <polyline points="${pts}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${pad}" cy="${H-pad-((data[0]/max)*(H-2*pad))}" r="4" fill="#3b82f6"/>
      <circle cx="${W-pad}" cy="${H-pad-((data[data.length-1]/max)*(H-2*pad))}" r="4" fill="#10b981"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px">
      <span>Heute</span><span>In ${years} Jahren</span>
    </div>
  </div>`;
}

function barChart(vals, labels) {
  const W = 300, H = 120, pad = 20;
  const max = Math.max(...vals);
  const colors = ['#ef4444','#10b981'];
  const barW = (W - 2*pad) / vals.length - 10;

  const bars = vals.map((v,i) => {
    const bh = ((v/max) * (H - 2*pad));
    const x = pad + i * ((W - 2*pad) / vals.length) + 5;
    const y = H - pad - bh;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="${colors[i]}"/>`;
  }).join('');

  return `<div class="chart-wrap" style="background:var(--bg3);padding:12px">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
      ${bars}
    </svg>
    <div style="display:flex;justify-content:space-around;font-size:11px;color:var(--text2);margin-top:4px">
      ${labels.map((l,i) => `<span style="color:${['#ef4444','#10b981'][i]}">${l}</span>`).join('')}
    </div>
  </div>`;
}

function miniChart(points, color, labels, annotations) {
  const W=320, H=100, pL=8, pR=8, pT=12, pB=20;
  const xs = points.map(p=>p[0]), ys = points.map(p=>p[1]);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const rangeY = maxY-minY || 1;
  const xOf = x => pL + ((x-minX)/(maxX-minX||1))*(W-pL-pR);
  const yOf = y => pT + (1-(y-minY)/rangeY)*(H-pT-pB);
  const pts = points.map(p=>`${xOf(p[0])},${yOf(p[1])}`).join(' ');
  const area = `M${xOf(xs[0])},${yOf(ys[0])} ${points.map(p=>`L${xOf(p[0])},${yOf(p[1])}`).join(' ')} L${xOf(xs[xs.length-1])},${H-pB} L${xOf(xs[0])},${H-pB} Z`;

  const annSvg = (annotations||[]).map(a => {
    const cx = xOf(a.x), cy = yOf(a.y);
    return `<circle cx="${cx}" cy="${cy}" r="4" fill="${a.color||'#f59e0b'}" stroke="#0f172a" stroke-width="1.5"/>
            <text x="${cx}" y="${cy-8}" font-size="9" fill="${a.color||'#f59e0b'}" text-anchor="middle" font-weight="600">${a.label}</text>`;
  }).join('');

  const labelSvg = (labels||[]).map(l =>
    `<text x="${xOf(l.x)}" y="${H-5}" font-size="9" fill="#64748b" text-anchor="middle">${l.text}</text>`
  ).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    <defs><linearGradient id="cg${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#cg${color.replace('#','')})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${annSvg}${labelSvg}
  </svg>`;
}

function chartCard(title, subtitle, color, points, labels, annotations, explanation, badge) {
  return `<div class="card" style="margin-bottom:14px">

      <div style="flex:1">

function generateCode() {
  const data = { n: userName, f: favorites, u: understood, h: highscore };
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

function restoreFromCode(code) {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (data.n) { saveUserName(data.n); }
    if (Array.isArray(data.f)) { favorites = data.f; saveFavs(); }
    if (Array.isArray(data.u)) { understood = data.u; saveUnderstood(); }
    if (typeof data.h === 'number') { highscore = data.h; localStorage.setItem('highscore', highscore); }
    return true;
  } catch(e) { return false; }
}

  const code = generateCode();

function bindEvents() {
  // Tour highlight + dynamic card positioning
  if (state.tourActive) {
    const step = TOUR_STEPS[state.tourStep];
    const card = document.querySelector('.tour-card');
    if (step.id) {
      const el = document.getElementById(step.id);
      if (el) {
        el.classList.add('tour-highlight');
        // Scroll element into view (top, below header)
        const headerH = document.querySelector('.header')?.offsetHeight || 56;
        const rect = el.getBoundingClientRect();
        const scrollTop = window.pageYOffset + rect.top - headerH - 12;
        window.scrollTo({top: scrollTop, behavior: 'smooth'});
      }
    }
    // Always center card vertically in available viewport
    if (card) {
      setTimeout(() => {
        const headerH = document.querySelector('.header')?.offsetHeight || 56;
        const navH = 80;
        const availH = window.innerHeight - headerH - navH;
        const cardH = card.offsetHeight;
        const cardTop = headerH + Math.max(0, (availH - cardH) / 2);
        card.style.top = cardTop + 'px';
      }, 360);
    }
  }
  // Search input
  const si = document.getElementById('searchInput');
  if (si) {
    si.addEventListener('input', e => {
      state.searchQ = e.target.value;
      render();
      setTimeout(() => { const el = document.getElementById('searchInput'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }, 0);
    });
  }
  // Name input enter key
  const ni = document.getElementById('nameInput');
  if (ni) {
    ni.focus();
    ni.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const n = ni.value.trim();
        if (n) { saveUserName(n); state.page = 'home'; render(); }
      }
    });
  }
  // Calc inputs — nur bei blur/change aktualisieren, nie während des Tippens
  document.querySelectorAll('[data-action="calcUpdate"]').forEach(el => {
    el.addEventListener('change', () => render());
    el.addEventListener('blur',   () => render());
  });

  // Swipe gestures for category view
  if (state.page === 'category') {
    const pg = document.getElementById('catPage');
    if (pg) {
      let tx = 0;
      pg.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
      pg.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 50) {
          const terms = termsByCategory(state.categoryId);
          if (dx < 0 && state.catTermIdx < terms.length - 1) { state.catTermIdx++; window.scrollTo(0,0); render(); }
          else if (dx > 0 && state.catTermIdx > 0) { state.catTermIdx--; window.scrollTo(0,0); render(); }
        }
      }, {passive:true});
    }
  }

  // Interactive Zinseszins chart
  const czChart = document.getElementById('czChart');
  if (czChart) {
    const chartData = JSON.parse(decodeURIComponent(czChart.dataset.chart));
    const years  = parseInt(czChart.dataset.years);
    const maxV   = parseFloat(czChart.dataset.maxv);
    const pL     = parseFloat(czChart.dataset.pl);
    const pT     = parseFloat(czChart.dataset.pt);
    const cW     = parseFloat(czChart.dataset.cw);
    const cH     = parseFloat(czChart.dataset.ch);
    const pB     = parseFloat(czChart.dataset.pb);

    const line    = document.getElementById('czLine');
    const dot     = document.getElementById('czDot');
    const tooltip = document.getElementById('czTooltip');
    const hitArea = document.getElementById('czHitArea');

    function updateIndicator(clientX) {
      const rect = czChart.getBoundingClientRect();
      const svgW = rect.width;
      const scaleX = 340 / svgW; // viewBox width / actual width
      const relX = (clientX - rect.left) * scaleX;
      const clampX = Math.max(pL, Math.min(pL + cW, relX));
      const fraction = (clampX - pL) / cW;
      const yearF = fraction * years;
      const yearIdx = Math.min(Math.round(yearF), years);
      const d = chartData[yearIdx];
      if (!d) return;

      const yTot = pT + cH - (d.total / maxV) * cH;
      const xPos = pL + (d.year / years) * cW;

      line.setAttribute('x1', xPos); line.setAttribute('x2', xPos);
      line.setAttribute('y1', pT); line.setAttribute('y2', pT + cH);
      line.removeAttribute('display');

      dot.setAttribute('cx', xPos); dot.setAttribute('cy', yTot);
      dot.removeAttribute('display');

      const totalK = d.total >= 1000000 ? (d.total/1000000).toFixed(2)+'M' : d.total >= 1000 ? (d.total/1000).toFixed(1)+'k' : Math.round(d.total);
      const invK   = d.invested >= 1000 ? (d.invested/1000).toFixed(1)+'k' : Math.round(d.invested);
      const gain   = d.total - d.invested;
      const gainK  = gain >= 1000000 ? (gain/1000000).toFixed(2)+'M' : gain >= 1000 ? (gain/1000).toFixed(1)+'k' : Math.round(gain);
      tooltip.innerHTML = `<strong>Jahr ${d.year}</strong><br>💰 ${totalK} € gesamt<br>📥 ${invK} € eingezahlt<br>📈 +${gainK} € Zinseszins`;

      // Position tooltip: left or right of indicator
      const tooltipW = 160;
      const tooltipLeft = xPos / scaleX + rect.left - rect.left; // in SVG coords
      if (xPos + tooltipW/scaleX > pL + cW) {
        tooltip.style.right = ((pL+cW - xPos)/scaleX * (svgW/340)) + 'px';
        tooltip.style.left = 'auto';
      } else {
        tooltip.style.left = ((xPos - pL) / 340 * svgW + 4) + 'px';
        tooltip.style.right = 'auto';
      }
      tooltip.style.display = 'block';
    }

    function hideIndicator() {
      line.setAttribute('display','none');
      dot.setAttribute('display','none');
      tooltip.style.display = 'none';
    }

    hitArea.addEventListener('mousemove', e => updateIndicator(e.clientX));
    hitArea.addEventListener('mouseleave', hideIndicator);
    hitArea.addEventListener('touchstart', e => { e.preventDefault(); updateIndicator(e.touches[0].clientX); }, {passive:false});
    hitArea.addEventListener('touchmove',  e => { e.preventDefault(); updateIndicator(e.touches[0].clientX); }, {passive:false});
    hitArea.addEventListener('touchend',   hideIndicator);
  }
}

document.body.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === 'nav') {
    state.prevPage = state.page;
    state.page = id;
    if (id === 'quiz' && state.quizDone) { state.quizDone = false; state.quizQuestions = []; }
    render();
  }
  else if (action === 'back') {
    if (state.page === 'learn') {
      state.page = 'learn-pick';
    } else if (state.page === 'learn-done') {
      state.page = 'learn-pick';
    } else if (state.page === 'learn-pick') {
      state.page = 'home';
    } else if (state.page === 'disclaimer' || state.page === 'account') {
      state.page = 'home';
    } else if (state.page === 'term' || state.page === 'module') {
      state.page = state.prevPage || 'home';
    } else {
      state.page = 'home';
    }
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'goterm') {
    state.prevPage = state.page;
    state.termId = id;
    state.page = 'term';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'gocat') {
    state.prevPage = state.page;
    state.categoryId = id;
    state.catTermIdx = 0;
    state.page = 'category';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'catPrev') {
    if (state.catTermIdx > 0) { state.catTermIdx--; window.scrollTo(0,0); render(); }
  }
  else if (action === 'catNext') {
    const terms = termsByCategory(state.categoryId);
    if (state.catTermIdx < terms.length - 1) { state.catTermIdx++; window.scrollTo(0,0); render(); }
  }
  else if (action === 'gomodule') {
    state.prevPage = state.page;
    state.moduleId = id;
    state.page = 'module';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'golearn') {
    state.prevPage = state.page;
    state.page = 'learn-pick';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'startLearn') {
    const terms = id === 'all' ? [...TERMS] : termsByCategory(id);
    state.learnTerms = terms;
    state.learnIdx = 0;
    state.learnCatId = id;
    state.page = 'learn';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'learnUnderstood') {
    const t = state.learnTerms[state.learnIdx];
    if (!understood.includes(t.id)) { understood.push(t.id); saveUnderstood(); }
    state.learnIdx++;
    if (state.learnIdx >= state.learnTerms.length) state.page = 'learn-done';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'learnSkip') {
    state.learnIdx++;
    if (state.learnIdx >= state.learnTerms.length) state.page = 'learn-done';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'learnBack') {
    if (state.learnIdx > 0) { state.learnIdx--; window.scrollTo(0,0); render(); }
  }
  else if (action === 'onboardingNext') {
    localStorage.setItem('installDone','1');
    state.onboardingStep = 1;
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'saveName') {
    const input = document.getElementById('nameInput');
    const n = input ? input.value.trim() : '';
    if (n) {
      saveUserName(n);
      state.page = 'home';
      state.tourActive = true;
      state.tourStep = 0;
      // Show install prompt first if not PWA, mobile only
      const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const installDone = localStorage.getItem('installDone');
      if (!isPWA && !installDone && isMobile) {
        state.installShown = true;
        state.installDismissed = false;
      }
      render();
    } else { input && input.focus(); }
  }
  else if (action === 'closeInstall') {
    localStorage.setItem('installDone','1');
    state.installDismissed = true;
    document.querySelectorAll('.install-overlay,#installOverlay').forEach(e => e.remove());
  }
  else if (action === 'tourNext') {
    state.tourStep++;
    if (state.tourStep >= TOUR_STEPS.length) {
      state.tourActive = false;
      state.tourStep = 0;
    }
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'tourSkip') {
    state.tourActive = false;
    state.tourStep = 0;
    render();
  }
  else if (action === 'editName') {
    const n = prompt('Wie heißt du?', userName);
    if (n !== null && n.trim()) { saveUserName(n.trim()); render(); }
  }
  else if (action === 'goaccount') {
    state.prevPage = state.page;
    state.page = 'account';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'copyCode') {
    const el = document.getElementById('codeOut');
    if (el) {
      navigator.clipboard?.writeText(el.value).catch(() => {});
      el.select();
      document.execCommand('copy');
      const btn = document.querySelector('[data-action="copyCode"]');
      if (btn) { btn.textContent = '✅ Kopiert!'; setTimeout(() => btn.textContent = '📋 Code kopieren', 2000); }
    }
  }
  else if (action === 'restoreCode') {
    const el = document.getElementById('codeIn');
    const msg = document.getElementById('restoreMsg');
    const code = el?.value || '';
    if (restoreFromCode(code)) {
      if (msg) { msg.style.color = 'var(--green)'; msg.textContent = '✅ Fortschritt erfolgreich wiederhergestellt!'; }
      setTimeout(() => { state.page = 'home'; render(); }, 1500);
    } else {
      if (msg) { msg.style.color = 'var(--red)'; msg.textContent = '❌ Ungültiger Code. Bitte nochmal prüfen.'; }
    }
  }
  else if (action === 'godisclaimer') {
    state.prevPage = state.page;
    state.page = 'disclaimer';
    window.scrollTo(0,0);
    render();
  }
  else if (action === 'toggleDark') {
    state.dark = !state.dark;
    localStorage.setItem('dark', state.dark ? '1' : '0');
    render();
  }
  else if (action === 'toggleFav') {
    if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
    else favorites.push(id);
    saveFavs();
    render();
  }
  else if (action === 'toggleUnderstood') {
    if (understood.includes(id)) understood = understood.filter(u => u !== id);
    else understood.push(id);
    saveUnderstood();
    render();
  }
  else if (action === 'startQuiz') {
    state.quizQuestions = getQuizTerms();
    state.quizQ = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
    state.quizDone = false;
    render();
  }
  else if (action === 'quizAnswer') {
    if (state.quizAnswered) return;
    state.quizSelected = parseInt(id);
    state.quizAnswered = true;
    const q = state.quizQuestions[state.quizQ];
    if (state.quizSelected === q.quiz.correct) state.quizScore++;
    render();
  }
  else if (action === 'quizNext') {
    state.quizQ++;
    state.quizAnswered = false;
    if (state.quizQ >= state.quizQuestions.length) {
      state.quizDone = true;
      if (state.quizScore > highscore) {
        highscore = state.quizScore;
        localStorage.setItem('highscore', highscore);
      }
    }
    render();
  }
  else if (action === 'calcTab') {
    state.calcTab = parseInt(id);
    render();
  }
  else if (action === 'immoModeRate') {
    state.immoModeRate = true; render();
  }
  else if (action === 'immoModeMonth') {
    state.immoModeRate = false; render();
  }
  else if (action === 'showTurningInfo') {
    const overlay = document.createElement('div');
    overlay.className = 'info-modal-overlay';
    overlay.innerHTML = `<div class="info-modal">
      <div style="font-size:32px;margin-bottom:12px;text-align:center">⚡</div>
      <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:12px;text-align:center">Der Turning Point</div>
      <div style="font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:16px">
        Ab diesem Jahr arbeitet dein Geld <strong style="color:var(--text)">mehr für dich</strong> als du selbst einzahlst.<br><br>
        Das bedeutet: Die Zinsen und Renditen, die dein investiertes Kapital automatisch erwirtschaftet, sind <strong style="color:var(--green)">größer als deine monatliche Einzahlung</strong>.<br><br>
        Ab diesem Punkt wächst dein Vermögen immer schneller — nicht weil du mehr einzahlst, sondern weil der Zinseszins-Effekt die Kontrolle übernimmt. Dein Kapital verdient sich selbst seinen eigenen Zuwachs.<br><br>
        💡 <em>Das ist der Moment, wo langfristiges Investieren richtig mächtig wird.</em>
      </div>
      <button class="btn btn-green" onclick="this.closest('.info-modal-overlay').remove()">Verstanden ✓</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }
  else if (action === 'showInstallHelp') {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);
    const overlay = document.createElement('div');
    overlay.className = 'info-modal-overlay';
    overlay.innerHTML = `<div class="info-modal">
      <div style="font-size:32px;margin-bottom:8px;text-align:center">📲</div>
      <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;text-align:center">Als App installieren</div>
      ${isIOS ? `
        <div style="margin-bottom:14px">
          <div style="font-weight:700;color:var(--text);margin-bottom:8px">🍎 iPhone — Safari</div>
          <div style="background:var(--bg3);border-radius:12px;padding:12px;font-size:13px;color:var(--text2);line-height:1.9">
            1. Tippe unten <strong style="color:var(--text)">neben dem Link auf die drei Punkte •••</strong><br>
            2. Tippe auf <strong style="color:var(--text)">„Teilen"</strong><br>
            3. Wähle <strong style="color:var(--text)">„Zum Home-Bildschirm hinzufügen"</strong><br>
            4. Tippe auf <strong style="color:var(--text)">„Hinzufügen"</strong>
          </div>
        </div>
        <div style="margin-bottom:16px">
          <div style="font-weight:700;color:var(--text);margin-bottom:8px">🍎 iPhone — Chrome</div>
          <div style="background:var(--bg3);border-radius:12px;padding:12px;font-size:13px;color:var(--text2);line-height:1.9">
            1. Tippe oben rechts <strong style="color:var(--text)">neben der Adresszeile auf das Symbol □↑</strong><br>
            2. Tippe auf <strong style="color:var(--text)">„Mehr anzeigen"</strong><br>
            3. Wähle <strong style="color:var(--text)">„Zum Startbildschirm hinzufügen"</strong><br>
            4. Tippe auf <strong style="color:var(--text)">„Hinzufügen"</strong>
          </div>
        </div>` : isAndroid ? `
        <div style="margin-bottom:16px">
          <div style="font-weight:700;color:var(--text);margin-bottom:8px">🤖 Android — Chrome</div>
          <div style="background:var(--bg3);border-radius:12px;padding:12px;font-size:13px;color:var(--text2);line-height:1.9">
            1. Tippe oben rechts auf die <strong style="color:var(--text)">drei Punkte ⋮</strong><br>
            2. Wähle <strong style="color:var(--text)">„Zum Startbildschirm hinzufügen"</strong><br>
            3. Tippe auf <strong style="color:var(--text)">„Hinzufügen"</strong>
          </div>
        </div>` : `
        <div style="margin-bottom:8px;font-size:13px;color:var(--text2);line-height:1.8">
          <strong style="color:var(--text)">iPhone/Safari:</strong> ••• neben Link → Teilen → Zum Home-Bildschirm<br>
          <strong style="color:var(--text)">iPhone/Chrome:</strong> □↑ neben Adresszeile → Mehr → Zum Startbildschirm<br>
          <strong style="color:var(--text)">Android/Chrome:</strong> ⋮ → Zum Startbildschirm hinzufügen
        </div>`}
      <button class="btn btn-green" onclick="this.closest('.info-modal-overlay').remove()">Alles klar ✓</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }
});

// ============================================================
// INIT
// ============================================================
if (!userName) {
  state.page = 'onboarding';
} else {
  // Existing user: show install prompt once if not PWA, mobile only
  const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const installDone = localStorage.getItem('installDone');
  if (!isPWA && !installDone && isMobile) {
    state.installShown = true;
    state.installDismissed = false;
  }
}
render();
</script>
</body>
</html>
